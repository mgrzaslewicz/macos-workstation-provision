---
- name: Install tmux
  hosts: all
  gather_facts: False
  tags: terminal,tmux
  tasks:
    - name: Install tmux
      homebrew:
        name: tmux
    - name: Install tpm
      ansible.builtin.git:
        repo: 'https://github.com/tmux-plugins/tpm'
        dest: "~/.tmux/plugins/tpm"
        version: master
    - name: Install workmux
      command: mise exec -- cargo binstall --no-confirm workmux
      register: workmux_install
      changed_when: "'already installed' not in (workmux_install.stdout + workmux_install.stderr)"
